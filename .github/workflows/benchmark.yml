name: Benchmark

on: workflow_dispatch

permissions:
  contents: write

concurrency:
  group: benchmark
  cancel-in-progress: false

env:
  RUNS: 5
  PAUSE_SECONDS: 5
  TIMEOUT_SECONDS: 300

jobs:
  benchmark:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 24

      - name: Install linters
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          npm install -g @redocly/cli@snapshot @scalar/cli@latest @stoplight/spectral-cli@latest @quobix/vacuum@latest
          npm install --prefix ~/redocly-latest @redocly/cli@latest
          curl -fsSL https://go.speakeasy.com/cli-install.sh | sh

      - name: Record versions and machine
        run: |
          rm -rf results && mkdir results
          {
            echo "redocly $(redocly --version)"
            echo "redocly-latest $(~/redocly-latest/node_modules/.bin/redocly --version)"
            echo "scalar $(scalar --version)"
            echo "speakeasy $(speakeasy --version | head -1 | awk '{print $NF}')"
            echo "spectral $(spectral --version)"
            echo "vacuum $(vacuum version)"
          } | tee results/versions.txt
          echo "$(lscpu | sed -n 's/^Model name: *//p'), $(nproc) cores, $(free -g | awk '/^Mem/ {print $2}') GB RAM, $(uname -sr), Node $(node --version)" | tee results/machine.txt
          echo "$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID" > results/run.txt
          date -u +"%Y-%m-%d %H:%M UTC" >> results/run.txt

      # The latest version of each source listed in the README, bundled into one file straight from its URL.
      - name: Fetch descriptions
        run: |
          redocly bundle https://raw.githubusercontent.com/Azure/azure-rest-api-specs/main/specification/compute/resource-manager/Microsoft.Compute/Compute/stable/2026-04-01/ComputeRP.json -o openapi/azure.yaml
          redocly bundle https://raw.githubusercontent.com/stripe/openapi/master/openapi/spec3.yaml -o openapi/stripe.yaml
          redocly bundle https://raw.githubusercontent.com/digitalocean/openapi/main/specification/DigitalOcean-public.v2.yaml -o openapi/digitalocean.yaml
          redocly bundle https://raw.githubusercontent.com/APIs-guru/openapi-directory/main/APIs/amazonaws.com/ec2/2016-11-15/openapi.yaml -o openapi/aws-ec2.yaml
          redocly bundle https://raw.githubusercontent.com/github/rest-api-description/main/descriptions/api.github.com/api.github.com.yaml -o openapi/github.yaml
          redocly bundle https://raw.githubusercontent.com/cloudflare/api-schemas/main/openapi.yaml -o openapi/cloudflare.yaml
          for file in openapi/*.yaml; do echo "$(basename $file .yaml) $(redocly stats $file --format json | jq .operations.total) $(stat -c %s $file)"; done | tee results/descriptions.txt

      - name: Redocly CLI
        run: scripts/bench.sh redocly redocly lint

      - name: Redocly CLI latest
        run: scripts/bench.sh redocly-latest ~/redocly-latest/node_modules/.bin/redocly lint

      - name: Scalar CLI
        run: scripts/bench.sh scalar scalar document lint

      - name: Speakeasy CLI
        run: scripts/bench.sh speakeasy env -u GITHUB_ACTIONS speakeasy lint openapi --non-interactive --schema

      - name: Spectral
        run: scripts/bench.sh spectral spectral lint --ruleset .spectral.yaml

      - name: vacuum
        run: scripts/bench.sh vacuum vacuum lint

      - name: Render README.md
        run: node scripts/render-readme.mjs

      - name: Commit results
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add README.md results
          git commit -m "chore: update benchmark results"
          git push
